[workspace]
members = [
    "crates/condroid-protocol",
    "crates/condroid-uinput",
    "crates/condroid-server",
    "crates/condroid-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Condroid Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/condroid/condroid"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
byteorder = "1.5"
evdev = "0.13.2"
crossterm = "0.28"
